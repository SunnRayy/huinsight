<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--color-bg);}body{font-family:var(--font-sans);color:var(--color-fg-1);padding:20px;box-sizing:border-box;}*{box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:500 10px var(--font-mono);color:var(--color-fg-3);text-transform:uppercase;letter-spacing:.05em;width:84px}</style></head><body><div id="root"></div>
<script>
(function () {
const H = window.Huinsight, h = React.createElement;
function App(){
  return h("div",{className:"col",style:{width:420,gap:18}},
    ...[[1.2,"within"],[3.4,"half tolerance"],[-6.8,"over"]].map(([d,l])=>h("div",{key:l,className:"row",style:{flexWrap:"nowrap"}},h("span",{className:"lbl",style:{width:120}},(d>0?"+":"")+d+"% "+l),h("div",{style:{flex:1}},h(H.DriftGauge,{drift:d,tolerance:5})))),
    h("div",{className:"row",style:{flexWrap:"nowrap"}},h("span",{className:"lbl",style:{width:120}},"DriftRow 32→25%"),h("div",{style:{flex:1}},h(H.DriftRow,{current:32,target:25}))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script></body></html>
