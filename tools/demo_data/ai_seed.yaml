# =============================================================================
# Huinsight demo AI-advisor seed content (Round 5 finding #3, Phase 3a)
# =============================================================================
# Consumed by tools/demo_data/seed_ai.py — NOT read anywhere else. This file
# is the single source of truth for the demo persona's investor profile and
# strategy memos; the script contains no hard-coded content, only plumbing.
#
# Voice / consistency: every fact here traces back to
# tools/demo_data/persona.yaml (identity, holdings, targets, timeline). The
# household is "Xiaoming Wang" (王小明), the same fictional persona
# generate.py emits reader fixtures for. Asset ids below are the canonical
# ids that actually land in `holdings.asset_id` after a demo sync — verified
# against a real synced demo DB while building this file (US_STK_* for the
# whole Schwab/IBKR equity sleeve including the ETFs, not US_ETF_* — the
# Consolidated co-authority merge normalizes them all to US_STK_*).
#
# Determinism: static content, no randomness. Editing this file changes what
# the seeder writes; the seeder itself has no logic that could produce a
# different result for the same file.
#
# Language: written in English — the demo UI's default language
# (src/services/ai_advisor/language_resolver.py DEFAULT_LANGUAGE). The
# `user_profile` table has a single `language` column (no per-locale content
# columns), so philosophy text cannot be stored in both languages at once;
# seed_ai.py sets user_profile.language = 'en' to match this content.

investor_profile:
  display_name: "Xiaoming Wang"
  language: en
  philosophy:
    goal: >-
      Reach financial independence on a ~CNY 3.5M net worth base, then
      compound it for long-term wealth preservation across US equities,
      Chinese funds, gold, and property — without depending on any single
      market, employer, or currency to get there.
    horizon: >-
      10-15 years to financial independence for the household as a whole.
      Individual satellite positions (CN thematic/sector funds, each Amazon
      RSU vest) are reviewed on much shorter 1-3 year tactical windows
      inside that horizon — they are not held on the same conviction as the
      core.
    risk_tolerance: >-
      Can tolerate a max drawdown of roughly 25-30% on the growth sleeve
      (US equities plus CN satellite funds) without changing behavior. The
      core — property, gold, insurance, cash and deposits — needs to stay
      stable through any single-year shock; growth is taken on the
      satellite, not the core.
    core_weakness: >-
      Prone to chasing recent winners in CN thematic/sector funds (baijiu,
      growth-mixed) after a strong run, and slow to trim RSU concentration
      after a vest instead of following the standing sell-to-cover plan.
      Needs explicit, pre-committed rules at the moment of a big rally or a
      big drop — not in-the-moment discretion.
    portfolio_structure: >-
      Three-tier structure, target ranges in parentheses.


      Tier 1 — Core & Stability (45-55% of net worth): the 阳光花园 property
      (gross ~CNY 1.85M, mortgage declining monthly), the CN money-market
      fund (000198, 天弘余额宝货币A) as the CNY cash buffer, RMB/USD bank
      deposits, and the two active insurance policies (安泰终身寿险2019,
      惠民定期重疾) held purely for protection, not return. The lapsed
      旧意外险 policy is history, not part of current coverage.


      Tier 2 — Core Growth (30-40%): the US core index/ETF sleeve across
      Schwab and IBKR — VOO, VTI, IEFA, SCHD, BND for diversified equity and
      bond beta — plus CN core index exposure via 110020
      (易方达沪深300ETF联接A). Rebalance back toward target when any single
      core position drifts more than 5pp from its band.


      Tier 3 — Satellite & Concentrated (10-20%): AAPL and BRK-B
      single-stock positions, CN sector/thematic funds (161725
      招商中证白酒指数A, 005827 易方达蓝筹精选混合, 519674 银河创新成长混合A),
      paper gold (~160g split 招行/建行) as a non-correlated inflation
      hedge (target 5-8% of net worth — revisit sizing above that band),
      and Amazon RSU. RSU follows the standing sell-to-cover plan (4 of
      every 12 vested shares); anything held beyond that standing plan
      needs the discipline check from the core-weakness note above before
      it counts as a deliberate decision rather than inertia.

# ---------------------------------------------------------------------------
# strategy_memos — 3 memos, dated after the persona's Schwab snapshot
# (2026-05-23) and inside a plausible Q2/Q3 2026 review cadence.
# ---------------------------------------------------------------------------
strategy_memos:
  - memo_date: "2026-06-05"
    title: "US Equity Sleeve Review — Core Index Weighting vs AAPL/BRK-B Satellites"
    strategic_bias: neutral
    key_directives:
      - "Hold VOO/VTI/SCHD/BND as the core US beta sleeve; no new core index buys above the standing rebalance band."
      - "Cap combined AAPL + BRK-B satellite weight at 20% of the US equity sleeve; trim on drift above that."
      - "IEFA (developed ex-US) stays a standing diversifier, not a tactical trade — do not time it."
    content: >-
      Reviewed the full US equity sleeve across Schwab (VOO, QQQ, SCHD,
      AAPL, BRK-B, BND) and IBKR (VTI, IEFA) against the Tier 2/Tier 3
      target bands in the investor profile.


      Core (VOO, VTI, SCHD, BND): all four are within their target bands.
      No action — the standing rebalance rule (rebalance when any single
      core position drifts more than 5pp from target) has not triggered
      for any of them.


      Satellite (AAPL, BRK-B): combined single-stock weight is currently
      well inside the 20%-of-equity-sleeve cap set for this pair. No trim
      required this cycle. QQQ is treated as a tactical growth tilt on top
      of the core, not a satellite single-name bet, and is not subject to
      the AAPL/BRK-B cap.


      IEFA is a standing developed-ex-US diversifier inside the core
      sleeve — it is not sized or timed as a satellite position, and this
      memo does not propose changing that.


      Directive for next review: re-check the AAPL + BRK-B combined weight
      against the 20% cap; nothing else on this sleeve needs a standing
      trigger before then.

  - memo_date: "2026-07-10"
    title: "CN Core-Satellite Fund Thesis — 110020 Core vs 161725/519674/005827 Satellites"
    strategic_bias: defensive
    key_directives:
      - "Falsification: revisit 110020 (CSI 300 core tracker) sizing if it drifts more than 5pp from its target allocation band for two consecutive monthly reviews."
      - "Falsification: 161725 (招商中证白酒指数A, baijiu sector) thesis is falsified if sector distribution-channel regulation materially changes fund flow economics, or if its weight exceeds 8% of net worth for two consecutive quarters without a corresponding trim."
      - "Falsification: 519674 (银河创新成长混合A) growth-mixed satellite is falsified if its 3-year rolling active share versus its benchmark drops below 60% (style drift toward closet indexing) — resize to core-only status if so."
      - "Falsification: 005827 (易方达蓝筹精选混合) is falsified if its top-10 holding concentration exceeds 60% of NAV, i.e. it has stopped behaving like a diversified blue-chip fund."
      - "NOT admissible as falsification for any of the above: price decline or unrealized loss alone. A falling price is what opens a value-trap review; it is not evidence the underlying thesis is broken."
    content: >-
      Falsification conditions for the CN fund book, split core vs
      satellite. This memo exists specifically so a future value-trap
      review on any of these funds has a documented thesis and explicit
      falsification clauses to check against — not just a price chart.


      Core: 110020 (易方达沪深300ETF联接A) is the CSI 300 core holding.
      Falsification: sizing is revisited if it drifts more than 5
      percentage points from its target allocation band for two
      consecutive monthly reviews. This is a sizing/drift check, not a
      performance judgment.


      Satellites: 161725 (招商中证白酒指数A), 519674 (银河创新成长混合A) and
      005827 (易方达蓝筹精选混合) are held as thematic/active satellites,
      each with its own falsification condition (see key directives) —
      sector regulation risk for 161725, active-share style drift for
      519674, and holding-concentration drift for 005827. None of the
      three is falsified by an unrealized loss by itself; a drawdown is
      the trigger that opens the review, and this memo's conditions are
      what the review is checked against.


      Explicit falsification conditions (for the Value-Trap Review
      feature to cite verbatim):
      1) 110020 core drifts >5pp from target band for 2 consecutive months.
      2) 161725 sector regulation changes distribution economics, OR its
         weight exceeds 8% of net worth for 2 consecutive quarters.
      3) 519674 3-year active share falls below 60% of benchmark.
      4) 005827 top-10 concentration exceeds 60% of NAV.
      Price decline and unrealized loss percentage are explicitly
      INADMISSIBLE as falsification evidence for any of the four — they
      open a review, they do not settle it.

  - memo_date: "2026-08-14"
    title: "Alternative & Concentration Risk Policy — Paper Gold, Amazon RSU, Property"
    strategic_bias: defensive
    key_directives:
      - "Paper gold (ALTS_Paper_Gold) target band is 5-8% of net worth; revisit sizing if it moves outside that band for a full quarter."
      - "RSU_AMZN: keep the standing sell-to-cover (4 of every 12 vested shares); any RSU held beyond that plan must be a deliberate decision, logged, not a default."
      - "Property (Property_阳光花园) is Tier 1 core — not rebalanced on price; mortgage paydown continues on schedule regardless of property valuation swings."
    content: >-
      Policy memo for the three positions that don't fit the standard
      equity/fund rebalance logic: paper gold, Amazon RSU, and the
      property.


      Paper gold (~160g combined across 招行 and 建行 paper-gold accounts)
      is held as a non-correlated inflation hedge, target 5-8% of net
      worth. It is not a tactical trading position — sizing is revisited
      only if it drifts outside that band for a full quarter, not on
      short-term gold-price moves.


      Amazon RSU vests quarterly (12 shares/vest); the standing plan
      sells 4 of every 12 vested shares to cover concentration risk
      automatically. Any RSU shares retained beyond that standing
      sell-to-cover plan must be a logged, deliberate decision — this is
      the household's known behavioral weakness (see investor profile
      core_weakness) and the reason this policy is written down instead
      of left to discretion at vest time.


      Property (阳光花园) is Tier 1 core. It is not rebalanced against
      short-term valuation moves; the mortgage paydown schedule is
      independent of the property's mark-to-market value.

