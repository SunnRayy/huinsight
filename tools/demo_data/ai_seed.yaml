# ---------------------------------------------------------------------------
# sample_brief / sample_review — Phase 3b (Round 5 finding #3). ONE sample
# daily Brief and ONE completed Review so a new user without an LLM key can
# see what the AI Advisor's output looks like before ever configuring a key.
#
# content_json under each follows the EXACT contract the real generator
# writes (src/services/ai_advisor/prompts.py _BRIEF_JSON_SCHEMA_BY_LANG /
# _REVIEW_JSON_SCHEMA_BY_LANG): stable ASCII section IDs from section_ids.py,
# enum values (status/action/accuracy_tier) exactly as defined there. This is
# what lets the existing UI (BriefSection.tsx, ReviewFlow.tsx) render every
# section with no code change.
#
# seed_ai.py marks both rows with model_used = 'demo-sample' — the marker the
# frontend badge (Program BIL demoSample i18n keys) checks for, and the same
# value used as this script's own idempotency key: "the one row per
# report_type carrying this marker" (ai_reports has no natural unique key to
# ON CONFLICT against, unlike strategy_memos/memo_registry).
#
# Every fact below traces to persona.yaml holdings and the strategy_memos /
# investor_profile seeded above — NOT to any live market reading. Numbers are
# deliberately avoided or hedged as "as of the demo snapshot" so this can
# never be mistaken for a real measurement (AGENTS.md Core Doctrine).
# ---------------------------------------------------------------------------
sample_brief:
  title: "Sample daily brief"
  content_json:
    macro_outlook:
      narrative: >-
        This is a sample brief, written for the demo persona (Xiaoming Wang)
        to show what the AI Advisor's daily output looks like — it is not
        generated by an AI model and does not reflect live market
        conditions. A real generated brief opens by synthesizing market
        temperature, the macro backdrop and portfolio state into a single
        top priority for the day; this sample keeps that synthesis
        illustrative rather than claiming any specific market reading, since
        the demo persona has no live market feed behind it.
      key_factors:
        - "Portfolio state, not the macro tape, drives this sample — see the holdings analysis below for the demo persona's actual tier structure."
        - "A real brief would cite specific macro drivers (rates, USD strength, sector rotation); this sample deliberately omits them so it is never mistaken for a live market read."
    holdings_risk:
      narrative: >-
        As of the demo snapshot, the three-tier structure from the investor
        profile is intact: Tier 1 core & stability, Tier 2 core growth (the
        US index sleeve plus 110020), and Tier 3 satellite & concentrated
        positions (AAPL, BRK-B, CN thematic funds, paper gold, Amazon RSU).
      positions:
        - name: "US core index sleeve (VOO / VTI / SCHD / BND)"
          status: hold
          comment: "Within target bands per the 2026-06-05 US Equity Sleeve Review memo — no rebalance trigger."
        - name: "AAPL + BRK-B satellites"
          status: watch
          comment: "Combined weight sits inside the 20%-of-equity-sleeve cap from the same memo; the standing directive is to re-check this pair every review cycle."
        - name: "161725 (招商中证白酒指数A)"
          status: watch
          comment: "Falsification condition from the 2026-07-10 CN memo: revisit if weight exceeds 8% of net worth for two consecutive quarters — not on price alone."
        - name: "Amazon RSU"
          status: watch
          comment: "Standing sell-to-cover plan (4 of every 12 vested shares) from the 2026-08-14 policy memo; any shares retained beyond it need a logged, deliberate decision."
    risk_alerts:
      narrative: >-
        Sample risk summary grounded in the seeded strategy memos'
        falsification conditions rather than any live drawdown reading.
      items:
        - title: "CN satellite concentration"
          severity: medium
          description: "161725 and its CN satellite siblings carry explicit falsification thresholds (sector regulation change, active-share drift, NAV concentration) — none are triggered by price movement alone."
        - title: "RSU concentration drift"
          severity: medium
          description: "The household's documented core weakness is under-trimming RSU after a vest; the standing sell-to-cover plan is the safeguard against that."
        - title: "Paper gold sizing band"
          severity: low
          description: "Target band is 5-8% of net worth; revisit only if it drifts outside that band for a full quarter, per the alternatives policy memo."
    action_items:
      narrative: >-
        This sample keeps every recommended action tied to a standing
        directive already on file, rather than a live buy/sell call the demo
        persona has no market data to justify.
      actions:
        - asset: "US core index sleeve"
          action: hold
          reasoning: "No position has drifted more than 5pp from its target band; the standing rebalance rule has not triggered."
        - asset: "AAPL + BRK-B"
          action: hold
          reasoning: "Combined satellite weight remains inside the 20% cap; trim only if that changes."
        - asset: "Amazon RSU"
          action: sell
          reasoning: "Continue the standing sell-to-cover plan (4 of every 12 vested shares) on the next vest; anything beyond that needs a logged decision."
    watchlist:
      narrative: >-
        Tomorrow's watch items are the same falsification triggers the
        strategy memos already define — this sample does not invent new
        ones.
      watchlist:
        - item: "110020 (CSI 300 core tracker) sizing"
          trigger: "Drifts more than 5pp from its target band for two consecutive monthly reviews"
          level: "Target allocation band, not a price level"
        - item: "161725 (白酒指数) weight"
          trigger: "Exceeds 8% of net worth for two consecutive quarters"
          level: "% of net worth"
        - item: "Paper gold sizing"
          trigger: "Outside the 5-8% of net worth band for a full quarter"
          level: "% of net worth"

sample_review:
  title: "Sample investment review 2026-07-15 ~ 2026-08-14"
  period_start: "2026-07-15"
  period_end: "2026-08-14"
  content_json:
    trade_summary:
      narrative: >-
        Sample review, written for the demo persona — not generated by an AI
        model. It walks through the trade-discipline framing a real Review
        would use, anchored to the standing plans already in the investor
        profile and strategy memos rather than any executed trade log.
      trades:
        - asset: "Amazon RSU"
          action: sell
          date: "2026-08-14"
          logic: "Standing sell-to-cover plan (4 of every 12 vested shares) executed on schedule per the alternative & concentration policy memo."
        - asset: "US core index sleeve (VOO/VTI/SCHD/BND)"
          action: hold
          date: "2026-08-14"
          logic: "No core position drifted more than 5pp from target; the standing rebalance rule did not trigger this period."
      grade_breakdown: {}
    advice_accuracy:
      narrative: >-
        This sample scorecard illustrates the format only — there is no live
        trade history behind the demo persona to grade against.
      scorecard:
        - decision: "Hold the US core sleeve through the review period"
          accuracy_tier: high
          verdict: "Consistent with the standing rebalance rule; no core position drifted more than 5pp from target."
        - decision: "Continue the standing RSU sell-to-cover plan instead of discretionary trimming"
          accuracy_tier: high
          verdict: "Matches the household's documented core weakness (under-trimming after a vest) and the pre-committed rule written to guard against it."
    portfolio_performance:
      narrative: >-
        A real Review would report period return, allocation drift and a
        benchmark comparison from live snapshots. This sample deliberately
        omits specific performance figures — the demo persona's snapshot is
        fixed as of 2026-05-23 and would misstate real, moving figures if
        presented as live results.
    lessons_learned:
      narrative: >-
        Sample lessons drawn straight from the seeded strategy memos'
        documented core weakness, not from any trade executed this period.
      lessons:
        - "Pre-committed rules (the RSU sell-to-cover plan, the AAPL+BRK-B 20% cap) work because they remove in-the-moment discretion at the exact points — a big rally or a big vest — where the household's documented core weakness would otherwise take over."
      improvements:
        - "Next review: re-check 110020 and the CN satellite funds against their falsification conditions before any new capital enters that sleeve."
    rule_updates:
      narrative: >-
        No new rules proposed in this sample — the existing falsification
        conditions and sizing bands from the strategy memos already cover
        this period's decisions.
      suggestions: []

# ---------------------------------------------------------------------------
# insights_lifecycle — Phase 3c (Round 5 finding #3). Populates ai_insights
# (src/services/ai_advisor/insight_manager.py) so the Insight Library shows
# real examples at every lifecycle stage: raw -> recurring -> validated ->
# principle. Every insight beyond 'raw' is written to already satisfy the F6
# promote gate (check_promotion_gate: confidence >= 0.70 OR validated_cases
# >= 3) at its OWN current confidence/validated_cases — the gate is stateless
# (re-evaluated fresh on every call), so a row's current fields must clear
# the gate for its current status to be internally consistent with the app's
# own promote_insight() logic. Nothing here is a live measurement: every
# confidence/validated_cases value is this seeder's own editorial judgment
# about a fictional persona, exactly like the strategy memos above.
#
# entity_refs + created_at are chosen so several of these pair with REAL
# rows already produced by the demo generator/sync (transactions table) —
# this is what lets BehavioralMetricsComputer._decision_speed measure a
# genuine median days-to-trade without any fabricated transaction or price
# data (see tools/demo_data/seed_ai.py seed_insights_lifecycle docstring for
# the exact asset/date pairing rationale).
#
# category: 'recommendation' is a real, code-recognized category (see
# insight_manager.bridge_ai_insights_to_decision_hub) — it is what makes an
# insight enter the Decision Hub / Review Center adoption funnel regardless
# of lifecycle status. Other categories ('risk','timing','sizing','strategy',
# 'process') stay Insight-Library-only until status reaches recurring/
# principle, at which point they bridge into the Decision Hub's growth
# timeline as category 'lesson' (see insight_manager.py module docstring).
