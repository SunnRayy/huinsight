sample_brief:
  title: "示例每日简报"
  content_json:
    macro_outlook:
      narrative: >-
        这是一份示例简报，为演示角色（王小明）撰写，用来展示 AI 顾问每日输出的样子——它不是 AI 模型生成的，也不反映实时市场状况。真正生成的简报会先把市场温度、宏观背景和组合状态归纳成当天唯一的优先事项；由于演示角色背后没有实时行情，这份示例只示意这种归纳方式，不声称任何具体的市场判断。
      key_factors:
        - "驱动这份示例的是组合状态，而不是宏观行情——演示角色实际的梯队结构见下方的持仓分析。"
        - "真正的简报会引用具体的宏观因素（利率、美元强弱、行业轮动）；这份示例刻意省略了这些，以免被误认为实时行情解读。"
    holdings_risk:
      narrative: >-
        截至演示快照，投资者画像中的三层梯队结构保持完整：第一梯队核心与稳定，第二梯队核心增长（美股指数仓位加 110020），第三梯队卫星与集中持仓（AAPL、BRK-B、境内主题基金、纸黄金、亚马逊 RSU）。不过，两把尺子给出的结论不一致。偏离预警按当前启用的风险档位（应用默认的「Balanced」）衡量各资产类别：对照它，权益明显超配，固定收益明显低配。家庭自己的规则按各核心仓位的区间衡量，其中没有一个偏离超过 5 个百分点。两者同时成立；下面的操作建议会说明今天以哪一个为准。
      positions:
        - name: "美股核心指数仓位（VOO / VTI / SCHD / BND）"
          status: watch
          comment: "按 2026-06-05 美股仓位复盘备忘录，每个仓位都在自己的区间内，单仓位规则没有触发。但从资产类别看，权益相对风险档位超配（见「高」级偏离预警），所以这里是「关注」，而不是单纯的「持有」。"
        - name: "AAPL + BRK-B 卫星仓位"
          status: watch
          comment: "合计权重在同一份备忘录设定的美股仓位 20% 上限之内；常设指令是每个复盘周期都重新核对这一对。"
        - name: "161725（招商中证白酒指数A）"
          status: watch
          comment: "来自 2026-07-10 境内基金备忘录的证伪条件：连续两个季度占净资产超过 8% 时重新评估——不只看价格。"
        - name: "亚马逊 RSU"
          status: watch
          comment: "按 2026-08-14 政策备忘录的既定卖股缴税计划（每归属 12 股卖出 4 股）执行；计划之外多留的股份需要记录在案的主动决定。"
    risk_alerts:
      narrative: >-
        示例风险汇总，依据的是已写入的策略备忘录中的证伪条件，而不是任何实时回撤读数。
      items:
        - title: "权益相对风险档位超配"
          severity: high
          description: "偏离预警指出，相对当前风险档位的资产类别目标，权益超配、固定收益低配。这个档位是应用的默认值，不是这个家庭自己制定的计划。家庭自己的规则（单仓位 5 个百分点区间，2026-06-05 备忘录）并没有触发。两者之间的差距才是真正的发现：要么启用一个与梯队结构相符的风险档位，要么接受这些类别目标，并计划补足固定收益。"
        - title: "境内卫星基金集中度"
          severity: medium
          description: "161725 及其他境内卫星基金都有明确的证伪阈值（行业监管变化、主动份额漂移、净值集中度）——仅价格波动不会触发其中任何一项。"
        - title: "RSU 集中度漂移"
          severity: medium
          description: "家庭有记录的核心弱点是 RSU 归属后减持不足；既定的卖股缴税计划就是针对这一点的保障。"
        - title: "纸黄金仓位区间"
          severity: low
          description: "目标区间为净资产的 5–8%；按另类资产政策备忘录，只有整整一个季度偏离这个区间时才重新评估。"
    action_items:
      narrative: >-
        这份示例中每一条建议操作，都对应一条已经备案的常设指令，而不是演示角色缺乏行情依据的实时买卖建议。
      actions:
        - asset: "美股核心指数仓位"
          action: hold
          reasoning: "相对风险档位，权益超配（「高」级偏离预警）；但按 2026-06-05 备忘录，这部分仓位以单仓位区间规则为准，没有任何仓位偏离其区间超过 5 个百分点。所以暂不减持。已标记到下次复盘，届时需要决定这个家庭究竟遵循哪一套目标。"
        - asset: "AAPL + BRK-B"
          action: hold
          reasoning: "卫星仓位合计权重仍在 20% 上限之内；只有超过时才减持。"
        - asset: "亚马逊 RSU"
          action: sell
          reasoning: "下次归属时继续执行既定的卖股缴税计划（每归属 12 股卖出 4 股）；计划之外的任何操作都需要记录在案的决定。"
    watchlist:
      narrative: >-
        明日关注事项沿用策略备忘录已经定义的证伪触发条件——这份示例不另造新的条件。
      watchlist:
        - item: "资产类别层面的权益与固定收益"
          trigger: "下次复盘时仍偏离风险档位的类别目标，且仍未决定以哪套目标为准"
          level: "类别权重与当前风险档位对比，不是价格水平"
        - item: "110020（沪深 300 核心跟踪基金）仓位规模"
          trigger: "连续两次月度复盘偏离目标区间超过 5 个百分点"
          level: "目标配置区间，不是价格水平"
        - item: "161725（白酒指数）权重"
          trigger: "连续两个季度占净资产超过 8%"
          level: "占净资产的百分比"
        - item: "纸黄金仓位规模"
          trigger: "整整一个季度处于净资产 5–8% 区间之外"
          level: "占净资产的百分比"

sample_review:
  title: "示例投资复盘 2026-07-15 ~ 2026-08-14"
  period_start: "2026-07-15"
  period_end: "2026-08-14"
  content_json:
    trade_summary:
      narrative: >-
        这是一份为演示角色撰写的示例复盘，并非 AI 模型生成。它演示了真正的复盘会采用的交易纪律框架，依据的是投资者画像和策略备忘录中已有的常设计划，而不是任何已执行的交易记录。
      trades:
        - asset: "亚马逊 RSU"
          action: sell
          date: "2026-08-14"
          logic: "按另类资产与集中度政策备忘录，如期执行了既定的卖股缴税计划（每归属 12 股卖出 4 股）。"
        - asset: "美股核心指数仓位（VOO/VTI/SCHD/BND）"
          action: hold
          date: "2026-08-14"
          logic: "依据 2026-06-05 备忘录的单仓位区间规则继续持有：没有核心仓位偏离其区间超过 5 个百分点。但从资产类别看，整个复盘期内权益相对当前风险档位一直超配，而这次持有并没有回应这一点。"
      grade_breakdown: {}
    advice_accuracy:
      narrative: >-
        这份示例评分卡只演示格式——演示角色背后没有实时交易历史可供评分。
      scorecard:
        - decision: "复盘期内继续持有美股核心仓位"
          accuracy_tier: medium
          verdict: "按家庭自己写下的规则是对的：没有核心仓位离开它的区间。但整个复盘期内，偏离预警一直显示权益相对当前风险档位超配、固定收益低配，而这次持有始终没有回应这一点。按一套目标是对的，按另一套目标则未经审视。"
        - decision: "继续执行既定的 RSU 卖股缴税计划，而不是凭判断减持"
          accuracy_tier: high
          verdict: "与家庭有记录的核心弱点（归属后减持不足）相符，也符合为防范这一弱点而事先定下的规则。"
    portfolio_performance:
      narrative: >-
        真正的复盘会根据实时快照报告期间收益、配置偏离和基准对比。这份示例刻意省略具体业绩数字——演示角色的快照固定在 2026-05-23，如果当作实时结果展示，会错误地描述真实、变动中的数字。
    lessons_learned:
      narrative: >-
        示例经验直接取自已写入的策略备忘录中记录的核心弱点，而不是本期执行的任何交易。
      lessons:
        - "事先定好的规则（RSU 卖股缴税计划、AAPL+BRK-B 的 20% 上限）之所以有效，是因为它们恰好在大涨或大批归属这种时刻——也就是家庭有记录的核心弱点最容易占上风的时候——去掉了临场判断。"
      improvements:
        - "决定以哪套目标为准。单仓位区间和风险档位的类别目标对权益的判断不一致：要么启用一个与梯队结构相符的风险档位，要么接受这些类别目标并计划补足固定收益。"
        - "下次复盘：在新资金进入境内基金仓位之前，先对照证伪条件重新核对 110020 和各只境内卫星基金。"
    rule_updates:
      narrative: >-
        本期有一处规则缺口：策略备忘录设定了单仓位区间，却没有资产类别层面的目标，所以偏离预警只能退回到应用默认的风险档位。除此之外，证伪条件和仓位区间覆盖了本期的所有决策。
      suggestions:
        - "根据三层梯队结构写出资产类别层面的目标，并把它设为当前风险档位，让偏离预警和区间规则按同一份计划来衡量。"

