# =============================================================================
# Huinsight demo AI-advisor seed content, Chinese (zh-CN)
# =============================================================================
# The Chinese twin of ai_seed.yaml, read by `seed_ai.py --lang zh-CN`. Same
# persona, same structure, same facts: every number, date, id, enum value and
# tag is identical to the English file (tests/tools/test_seed_ai.py checks the
# two files key by key). Only the prose is Chinese. See ai_seed.yaml for the
# comments on why each section exists and how its rows are keyed.
#
# Terms follow the app's own zh-CN UI strings
# (ux-command-center/src/i18n/locales/zh-CN): 风险档位, 策略备忘录, 价值陷阱复盘,
# 偏离, 再平衡, 梯队, 演示角色.
#
# Writing note: each paragraph is ONE line. YAML folding joins wrapped lines
# with a space, which would put stray spaces inside Chinese sentences.
# Paragraphs are separated by two blank lines, as in the English file.

investor_profile:
  display_name: "王小明"
  language: zh-CN
  philosophy:
    goal: >-
      在 2038 年底前实现财务自由：可投资的流动资产达到 500 万元人民币（约为家庭 25 年的开支），以目前约 350 万元的净资产为起点。此后在美股、境内基金、黄金和房产之间长期复利、保值，不依赖任何单一市场、雇主或币种。
    horizon: >-
      全家实现财务自由的期限是 10–15 年。在这个期限之内，个别卫星仓位（境内主题/行业基金、每一批归属的亚马逊 RSU）按 1–3 年的短周期战术窗口复盘，对它们的信念强度不同于核心仓位。
    risk_tolerance: >-
      增长仓位（美股加境内卫星基金）可承受约 25–30% 的最大回撤而不改变操作。核心部分——房产、黄金、保险、现金和存款——必须扛得住任何单一年份的冲击；收益靠卫星仓位争取，不靠核心仓位。
    core_weakness: >-
      境内主题/行业基金（白酒、偏股混合）大涨之后容易追高；RSU 归属后常常拖着不减持，没有按既定的卖股缴税计划执行。在大涨或大跌的当下，需要事先定好的明确规则，而不是临场判断。
    portfolio_structure: >-
      三层梯队结构，括号内为目标区间。


      第一梯队——核心与稳定（占净资产 45–55%）：阳光花园房产（总价约 185 万元，房贷按月递减）、作为人民币现金缓冲的境内货币基金（000198，天弘余额宝货币A）、人民币/美元银行存款，以及两份有效保单（安泰终身寿险2019、惠民定期重疾）。保单只为保障，不追求收益。已失效的旧意外险只是历史记录，不属于当前保障。


      第二梯队——核心增长（30–40%）：分布在 Schwab 和 IBKR 的美股核心指数/ETF 仓位——VOO、VTI、IEFA、SCHD、BND，提供分散化的股票和债券贝塔——再加上通过 110020（易方达沪深300ETF联接A）持有的境内核心指数。任何一个核心仓位偏离其区间超过 5 个百分点，就再平衡回目标。


      第三梯队——卫星与集中持仓（10–20%）：AAPL 和 BRK-B 个股；境内行业/主题基金（161725 招商中证白酒指数A、005827 易方达蓝筹精选混合、519674 银河创新成长混合A）；作为低相关通胀对冲的纸黄金（约 160 克，分在招行和建行，目标占净资产 5–8%，超出这个区间就重新评估仓位）；以及亚马逊 RSU。RSU 按既定的卖股缴税计划执行（每归属 12 股卖出 4 股）；计划之外多留的股份，必须先通过上面「核心弱点」提到的纪律检查，才算深思熟虑的决定，而不是惯性。

retirement_goal:
  name: "财务自由"
  target_amount: 5000000
  target_date: "2038-12-31"
  notes: "演示角色的财务自由目标（投资者画像中的「目标」）。"

strategy_memos:
  - memo_date: "2026-06-05"
    title: "美股仓位复盘——核心指数权重与 AAPL/BRK-B 卫星仓位"
    strategic_bias: neutral
    key_directives:
      - "继续持有 VOO/VTI/SCHD/BND，作为美股核心贝塔仓位；超出既定再平衡区间时，不再新买核心指数。"
      - "AAPL + BRK-B 卫星仓位合计不超过美股仓位的 20%；超过即减持。"
      - "IEFA（美国以外的发达市场）是常设的分散化配置，不是战术交易——不择时。"
    content: >-
      对照投资者画像中第二、第三梯队的目标区间，复盘了 Schwab（VOO、QQQ、SCHD、AAPL、BRK-B、BND）和 IBKR（VTI、IEFA）上的全部美股仓位。


      核心（VOO、VTI、SCHD、BND）：四个仓位都在各自的目标区间内。不操作——既定的再平衡规则（任一核心仓位偏离目标超过 5 个百分点时再平衡）对它们都没有触发。


      卫星（AAPL、BRK-B）：两只个股合计权重远低于这一对设定的上限（美股仓位的 20%）。本轮无需减持。QQQ 视为叠加在核心之上的战术性增长倾斜，不是卫星个股押注，不受 AAPL/BRK-B 上限约束。


      IEFA 是核心仓位里常设的美国以外发达市场分散化配置——不按卫星仓位来定规模或择时，本备忘录也不建议改变这一点。


      下次复盘的指令：重新核对 AAPL + BRK-B 合计权重是否在 20% 上限内；在此之前，这部分仓位没有其他需要常设触发条件的事项。

  - memo_date: "2026-07-10"
    title: "境内核心-卫星基金论点——110020 核心与 161725/519674/005827 卫星"
    strategic_bias: defensive
    key_directives:
      - "证伪条件：如果 110020（沪深 300 核心跟踪基金）连续两次月度复盘偏离目标配置区间超过 5 个百分点，就重新评估仓位规模。"
      - "证伪条件：如果行业渠道监管发生实质变化、影响资金流的经济逻辑，或者 161725（招商中证白酒指数A，白酒行业）连续两个季度占净资产超过 8% 且未相应减持，其投资论点即被证伪。"
      - "证伪条件：如果 519674（银河创新成长混合A）相对基准的 3 年滚动主动份额降到 60% 以下（风格漂移成变相指数基金），这只偏股混合卫星基金的论点即被证伪——届时降为仅作核心配置。"
      - "证伪条件：如果 005827（易方达蓝筹精选混合）前十大持仓集中度超过净值的 60%，也就是不再像一只分散化的蓝筹基金，其论点即被证伪。"
      - "以上各项都不接受仅凭价格下跌或浮亏作为证伪依据。价格下跌只会开启一次价值陷阱复盘，并不证明底层论点已经失效。"
    content: >-
      境内基金的证伪条件，分核心和卫星两部分。写这份备忘录，是为了让今后对其中任何一只基金做价值陷阱复盘时，有成文的投资论点和明确的证伪条款可以对照——而不只是一张价格走势图。


      核心：110020（易方达沪深300ETF联接A）是沪深 300 核心持仓。证伪条件：连续两次月度复盘偏离目标配置区间超过 5 个百分点时，重新评估仓位规模。这是规模/偏离检查，不是业绩评判。


      卫星：161725（招商中证白酒指数A）、519674（银河创新成长混合A）和 005827（易方达蓝筹精选混合）作为主题/主动卫星持有，各有各的证伪条件（见核心指令）——161725 看行业监管风险，519674 看主动份额的风格漂移，005827 看持仓集中度漂移。三只都不会仅因浮亏而被证伪；回撤只是开启复盘的触发点，复盘要对照的是本备忘录列出的条件。


      明确的证伪条件（供价值陷阱复盘功能原文引用）：

      1）110020 核心连续 2 个月偏离目标区间超过 5 个百分点。

      2）161725 所在行业的监管变化改变了渠道经济逻辑，或其占净资产比例连续 2 个季度超过 8%。

      3）519674 的 3 年主动份额降到基准的 60% 以下。

      4）005827 前十大持仓集中度超过净值的 60%。

      价格下跌和浮亏比例明确不能作为这四只基金任何一只的证伪证据——它们只开启复盘，不决定结论。

  - memo_date: "2026-08-14"
    title: "另类资产与集中度风险政策——纸黄金、亚马逊 RSU、房产"
    strategic_bias: defensive
    key_directives:
      - "纸黄金（ALTS_Paper_Gold）目标区间为净资产的 5–8%；整整一个季度处于区间之外时，重新评估仓位。"
      - "RSU_AMZN：保持既定的卖股缴税计划（每归属 12 股卖出 4 股）；计划之外多留的 RSU 必须是记录在案的主动决定，而不是默认结果。"
      - "房产（Property_阳光花园）属于第一梯队核心——不按价格再平衡；无论房产估值如何波动，房贷都按计划还款。"
    content: >-
      这份政策备忘录针对三个不适用常规股票/基金再平衡逻辑的仓位：纸黄金、亚马逊 RSU 和房产。


      纸黄金（招行和建行纸黄金账户合计约 160 克）作为低相关的通胀对冲持有，目标为净资产的 5–8%。它不是战术交易仓位——只有在整整一个季度偏离这个区间时才重新评估仓位，不因短期金价波动而调整。


      亚马逊 RSU 每季度归属一次（每次 12 股）；既定计划是每归属 12 股自动卖出 4 股，以控制集中度风险。在这一卖股缴税计划之外多留的股份，必须是记录在案的主动决定——这正是家庭已知的行为弱点（见投资者画像中的核心弱点），也是把这条政策写下来、而不是留到归属时临场判断的原因。


      房产（阳光花园）属于第一梯队核心。它不随短期估值波动而再平衡；房贷还款计划与房产的市值无关。

